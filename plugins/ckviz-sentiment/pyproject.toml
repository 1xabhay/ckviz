[project]
name = "ckviz-sentiment"
version = "0.1.0"
description = "ckviz stage wrapping VADER sentiment (vaderSentiment, MIT)"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhay Singh" }]
keywords = ["ckviz", "convokit", "vader", "sentiment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["ckviz", "vaderSentiment>=3.3.2"]

[project.urls]
Repository = "https://github.com/1xabhay/ckviz"
Issues = "https://github.com/1xabhay/ckviz/issues"

[project.entry-points."ckviz.stages"]
sentiment = "ckviz_sentiment"

[tool.uv.sources]
ckviz = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
