[project]
name = "ckviz-dlatk"
version = "0.1.0"
description = "DLATK differential language analysis as ckviz stages (DLATK runs in its own uvx env)"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhay Singh" }]
keywords = ["ckviz", "convokit", "dlatk", "differential-language-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["ckviz"]

[project.urls]
Repository = "https://github.com/1xabhay/ckviz"
Issues = "https://github.com/1xabhay/ckviz/issues"

[project.entry-points."ckviz.stages"]
dlatk = "ckviz_dlatk"

[tool.uv.sources]
ckviz = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
